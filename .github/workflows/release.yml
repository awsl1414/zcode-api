name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "New release tag, e.g. v5.0.0"
        required: true
        type: string

permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      version: ${{ steps.check.outputs.version }}
      is_prerelease: ${{ steps.check.outputs.is_prerelease }}
    steps:
      - name: Validate tag and determine prerelease
        id: check
        env:
          TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! printf '%s' "$TAG" | grep -qE '^v'; then
            echo "::error::Release tag must start with 'v' (got: '$TAG')"
            exit 1
          fi
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            echo "::error::Tag '$TAG' already exists on the remote"
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          if printf '%s' "$TAG" | grep -qiE 'alpha|beta|rc'; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  verify:
    needs: detect
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          # PINNED (keep every release job + ci.yml in sync): the release
          # runtime must not drift from dev/CI — a floating "latest" shipped
          # v4.5.2 on Bun 1.4.0 semantics local 1.3.14 never exercised.
          # Bump deliberately, together with local dev environments and the
          # Dockerfile.
          bun-version: "1.4.4"
      - name: Cache bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-install-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # Same gate as ci.yml (package.json "typecheck" = tsc --noEmit), via the
      # script so package.json stays the single source for the command.
      - name: Type check
        run: bun run typecheck
      - name: Run tests
        run: bun test

  # Commit the tag's version into package.json so the repo never drifts from
  # released artifacts again — no manual bumping. `package.json` is the only
  # source: `src/version.ts` derives its VERSION from it, so one write updates
  # the CLI, the panel and the update checker together. Every downstream job
  # (builds / tag / docker) checks out this job's SHA and therefore builds from
  # a tree that already reports the right version.
  #
  # Version shape: the tag rules the released version ("v5.0.0" → "5.0.0").
  # Variant suffixes between releases (e.g. "5.0.0.beta.1") are fine — the
  # update checker (src/update/check.ts versionCore) strips them before
  # comparison, and the sed pattern below matches any quoted value, so the
  # released file still lands on plain semver.
  bump:
    needs: [detect, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the version-bump commit
    outputs:
      sha: ${{ steps.bump.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
      - name: Commit version bump
        id: bump
        env:
          VERSION: ${{ needs.detect.outputs.version }}
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "$BRANCH"
          # Re-run of a partially-failed workflow: the bump may already be on
          # the branch — reuse it instead of committing a duplicate.
          if git show "origin/$BRANCH:package.json" | grep -q "\"version\": \"${VERSION}\""; then
            echo "bump for ${VERSION} already on origin/$BRANCH — reusing it"
            echo "sha=$(git rev-parse "origin/$BRANCH")" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          sed -i "s/^  \"version\": \".*\",$/  \"version\": \"${VERSION}\",/" package.json
          grep -q "\"version\": \"${VERSION}\"" package.json
          git add package.json
          git commit -m "chore(release): bump version to ${VERSION}"
          if ! git push origin "HEAD:$BRANCH"; then
            # Branch moved on since dispatch — rebase and retry once. A
            # conflict on package.json fails loudly; re-dispatch.
            git fetch origin "$BRANCH"
            git rebase "origin/$BRANCH"
            grep -q "\"version\": \"${VERSION}\"" package.json
            git push origin "HEAD:$BRANCH"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # Desktop binaries. Targets match the release surface of package.json's
  # build:* scripts (linux-x64 / linux-arm64 / darwin-x64 / darwin-arm64 +
  # windows via the host-generic `build` script locally); the matrix spells
  # out all five so cross-compilation never depends on the runner's host OS.
  build-binaries:
    needs: [detect, bump]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: bun-windows-x64
            outfile: zcode-proxy.exe
          - target: bun-linux-x64
            outfile: zcode-proxy-linux-x64
          - target: bun-linux-arm64
            outfile: zcode-proxy-linux-arm64
          - target: bun-darwin-x64
            outfile: zcode-proxy-darwin-x64
          - target: bun-darwin-arm64
            outfile: zcode-proxy-darwin-arm64
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.bump.outputs.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4" # pinned — see verify job comment
      - name: Cache bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-install-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # The bump job already committed the version into the sources; this
      # guard fails the build loudly if the checkout somehow missed it (wrong
      # ref, reused bump pointing elsewhere, etc.).
      - name: Assert sources carry the release version
        env:
          RELEASE_VERSION: ${{ needs.detect.outputs.version }}
        run: |
          grep -q "\"version\": \"${RELEASE_VERSION}\"" package.json
          # src/version.ts derives from package.json; a stray literal there
          # would mean someone reintroduced a second source.
          grep -q 'from "../package.json"' src/version.ts
      # build-fork-worker.ts pre-bundles the captcha worker entry so
      # `bun build --compile` embeds it as a `with { type: "file" }` asset —
      # the compiled binary has no other worker entry (see
      # src/captcha/captcha-worker-dispatch.ts candidate 3).
      - name: Build binary
        run: >-
          bun run scripts/build-fork-worker.ts &&
          bun build --compile --target=${{ matrix.target }}
          --define "require.resolve=undefined"
          src/index.ts --outfile ${{ matrix.outfile }}
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.outfile }}
          path: ${{ matrix.outfile }}
          if-no-files-found: error

  release:
    needs: [detect, bump, build-binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Tag the BUMPED commit so the tag's tree already reports its own
      # version (not the pre-bump dispatch SHA).
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.bump.outputs.sha }}
      - name: Create and push tag
        env:
          TAG: ${{ needs.detect.outputs.tag }}
        run: |
          git tag "$TAG"
          git push origin "$TAG"
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      # Changelog is generated by GitHub from commits since the previous tag
      # (generate_release_notes); prerelease detection stays in the detect
      # job (alpha/beta/rc in the tag).
      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.detect.outputs.tag }}
          name: ${{ needs.detect.outputs.tag }}
          generate_release_notes: true
          prerelease: ${{ needs.detect.outputs.is_prerelease }}
          files: dist/*

  docker:
    needs: [detect, bump, release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # Build the image from the bumped commit so the bundled sources report
      # the release version (bump is a direct need — needs.* context only
      # exposes direct dependencies).
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.bump.outputs.sha }}
      - name: Compute lowercase image name
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER@L}/zcode-proxy" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.img.outputs.name }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ needs.detect.outputs.version }}
            type=raw,value=latest,enable=${{ needs.detect.outputs.is_prerelease == 'false' }}
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
