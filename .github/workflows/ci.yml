name: CI

# Triggered on every PR (any target) and on every push to master so direct
# commits are gated too. Required status checks (Settings → Branches →
# Branch protection rules) make CI failures block merge.
#
# Jobs mirror the local gate (`bun run typecheck` + `bun test`) plus the one
# build surface that only CI can exercise for every change:
#   - panel-build     — renderPanelPage()/renderLoginPage() must still
#                       assemble (a broken page.html slot or a bad page.ts
#                       edit fails here)

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

# Cancel superseded runs on the same ref — keeps PR feedback fast and saves
# CI minutes when a PR is force-pushed repeatedly.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Type check & tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          # PINNED: a floating "latest" silently drifted the release runtime
          # away from local dev (the v4.5.2 exe shipped on Bun 1.4.0
          # keep-alive timer semantics local 1.3.14 never exercised).
          # Bump deliberately, together with local dev environments and the
          # Dockerfile.
          bun-version: "1.4.4"

      - name: Cache bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          # bun.lock is the single dependency lock; a change to it invalidates
          # the whole cache (fine — the cache is a network optimization, not
          # correctness).
          key: bun-install-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run typecheck

      - name: Run tests
        run: bun test

  panel-build:
    name: Panel page build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4" # pinned — see test job comment

      - name: Cache bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-install-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The panel has no build chain: page.ts assembles page.html + CSS + i18n
      # + runtime scripts into two self-contained HTML strings at runtime. The
      # smoke renders both and fails if any slot is left unfilled or an asset
      # drops out of the inlined output. Kept separate from `test` so the
      # panel's assembly contract has its own required check.
      - name: Smoke-render panel pages
        run: bun run scripts/smoke-panel-build.ts
